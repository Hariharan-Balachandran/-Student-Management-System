<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Student</title>
  <style>
    body {
        font-family: 'Arial', sans-serif;
        background: url('/images/edit1.jpg') no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }
    .container {
        width: 400px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        color: #444;
    }
    input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }
    button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #2575fc;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        background: #6a11cb;
    }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #2575fc;
        text-decoration: none;
        font-weight: bold;
    }
    .back-link:hover {
        text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Edit Student</h2>
  <form th:action="@{/teacher/edit}" th:object="${student}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <label>Register Number</label>
    <input type="text" th:field="*{registerNumber}" required>

    <label>Name</label>
    <input type="text" th:field="*{name}" required>

    <label>Email</label>
    <input type="email" th:field="*{email}" required>

    <label>Marks</label>
    <input type="number" th:field="*{marks}" min="0" max="100">

    <label>Attendance (%)</label>
    <input type="number" th:field="*{attendance}" min="0" max="100">

    <button type="submit">Update Student</button>
  </form>
  <a class="back-link" th:href="@{/teacher/dashboard}">⬅ Back to Dashboard</a>
</div>
</body>
</html>
