<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .error-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 { color: #ff4d4d; }
    </style>
</head>
<body>
<div class="error-box">
    <h2>Something went wrong!</h2>
    <p th:text="${errorMessage}">Error details</p>
    <a th:href="@{/}">Go Back to Login</a>
</div>
</body>
</html>
