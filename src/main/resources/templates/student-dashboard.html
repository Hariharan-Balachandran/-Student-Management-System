<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            margin: 40px auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #2575fc;
            color: white;
        }
        tr:hover {
            background: #f1f1f1;
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination a {
            padding: 8px 12px;
            margin: 0 5px;
            background: #6a11cb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .pagination span {
            margin: 0 10px;
        }
        .logout-btn {
            float: right;
            margin-left: 10px;
            padding: 10px 20px;
            background: #ff4d4d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        .logout-btn:hover {
            background: #e60000;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Student Dashboard</h2>
    <a class="logout-btn" th:href="@{/logout}" onclick="return confirm('Are you sure you want to logout?')">Logout</a>
    <table>
        <tr>
            <th>ID</th>
            <th>Register No</th>
            <th>Name</th>
            <th>Email</th>
            <th>Marks</th>
            <th>Attendance</th>
        </tr>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.registerNumber}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.marks}"></td>
            <td th:text="${student.attendance} + '%'"></td>

        </tr>
    </table>

    <div class="pagination">
        <a th:if="${currentPage > 0}"
           th:href="@{'/student/dashboard?page=' + (${currentPage - 1}) + '&size=5'}">Prev</a>
        <span>Page [[${currentPage + 1}]] of [[${totalPages}]]</span>
        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{'/student/dashboard?page=' + (${currentPage + 1}) + '&size=5'}">Next</a>
    </div>
</div>
</body>
</html>
